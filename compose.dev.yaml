# Local test database for `bun run check`. Not a deployment file.
name: workbench-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench_test
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready --username workbench --dbname workbench_test"]
      interval: 1s
      timeout: 3s
      retries: 30
