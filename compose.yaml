name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  workbench:
    image: ${WORKBENCH_IMAGE:?WORKBENCH_IMAGE is required}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-}
      READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-}
      PLUGIN_HOOK_TIMEOUT_MS: ${PLUGIN_HOOK_TIMEOUT_MS:-}
      PLUGINS: ${PLUGINS:-}
    secrets:
      - database_url
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:?WORKBENCH_PORT is required}:3000"
    networks:
      - default
      - database
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - bun
        - --eval
        - "process.exit((await fetch('http://127.0.0.1:3000/health/ready')).ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 1s

  postgres:
    image: postgres:17@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: workbench
      POSTGRES_DB: workbench
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--host",
          "127.0.0.1",
          "--username",
          "workbench",
          "--dbname",
          "workbench",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

networks:
  database:
    internal: true

volumes:
  postgres-data:

secrets:
  database_url:
    file: ${SECRETS_DIRECTORY:-./secrets}/database_url
  postgres_password:
    file: ${SECRETS_DIRECTORY:-./secrets}/postgres_password
